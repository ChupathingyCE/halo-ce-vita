name: Windows install tool

# The install helper (tools/installer) on Windows: its tests, then
# HaloCEVitaInstaller.exe built by PyInstaller with ffmpeg inside (pinned
# download, checked by SHA-256: build_windows.py), checked by its selftest
# and uploaded as an artifact. Only runs when the tool changes.
on:
  # (run by hand or at a release tag only: every push used to build on
  # the private repo's paid runners)
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build and test tools
        # (certifi first, checked by its hash: what the program trusts)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/installer/requirements-certifi.txt
          python -m pip install -r tools/installer/requirements-build.txt -r tools/installer/requirements-dev.txt

      - name: Security tests (signatures, download allow-list, redirects, certificates)
        # (blocking: the download and verify tests without the Tk window ones,
        # INSTALLER_TESTS_NO_WINDOW: conftest.py leaves out every test that
        # opens the window)
        timeout-minutes: 10
        env:
          INSTALLER_TESTS_NO_WINDOW: "1"
        run: python -m pytest -q -rfE tools/installer/tests/test_pc_download.py tools/installer/tests/test_vpk_download.py

      - name: Tests
        # (all of them; the Tk window tests hang on the hosted Windows
        # runners: reported, never blocking the build. The security ones
        # block above)
        continue-on-error: true
        timeout-minutes: 12
        run: python -m pytest -q -rfE --maxfail=5 tools/installer/tests

      - uses: actions/cache@v4
        with:
          path: tools/installer/build/ffmpeg-download.zip
          key: ffmpeg-${{ hashFiles('tools/installer/build_windows.py') }}

      - name: Build HaloCEVitaInstaller.exe
        run: python tools/installer/build_windows.py

      - name: Self test of the built program
        shell: pwsh
        run: |
          $p = Start-Process -FilePath tools/installer/dist/HaloCEVitaInstaller.exe -ArgumentList "selftest","--report","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: HaloCEVitaInstaller
          path: tools/installer/dist/HaloCEVitaInstaller.exe
          retention-days: 14
